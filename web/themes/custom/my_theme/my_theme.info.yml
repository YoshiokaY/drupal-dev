name: My Theme
type: theme
description: 'Custom theme for Drupal Dev'
core_version_requirement: ^10 || ^11
base theme: false

libraries:
  - my_theme/global

# Twig namespace for partial includes
component-libraries:
  my_theme:
    paths:
      - templates

regions:
  header: Header
  primary_menu: Primary Menu
  secondary_menu: Secondary Menu
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  help: Help
  content: Content
  sidebar_first: Sidebar First
  sidebar_second: Sidebar Second
  footer: Footer
